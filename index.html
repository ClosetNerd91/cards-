<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yu-Gi-Oh! Binder</title>
<meta name="description" content="My Yu-Gi-Oh! card collection as a digital binder. Works offline.">
<meta name="theme-color" content="#a8821b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YGO Binder">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<script>window.BINDER_PWA = { sw: './sw.js' };</script>
<style>
:root{
  --bg:#f4f2ec; --bg2:#ebe7dd; --surface:#ffffff; --surface2:#f8f6f1; --text:#1d1e23; --muted:#6c6f79; --faint:#a3a5ad;
  --border:#e4dfd3; --border2:#d6d0c2; --accent:var(--accent-l,#8a6d1c); --accent-ink:#fff;
  --cover:var(--cover-l,#262a48); --paper:#fbfaf6; --paper-line:#ece7db; --pocket:#f1eee6;
  --shadow-sm:0 1px 2px rgba(30,25,10,.06),0 1px 1px rgba(30,25,10,.04);
  --shadow:0 6px 24px -8px rgba(30,25,10,.18),0 2px 6px rgba(30,25,10,.06);
  --shadow-lg:0 30px 80px -20px rgba(15,12,5,.35),0 10px 30px -10px rgba(15,12,5,.2);
  --r:14px; --r-sm:9px; --ease:cubic-bezier(.22,.8,.25,1);
  --sans:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --title:Georgia,serif;
  --card-aspect:59/86;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0e1015; --bg2:#14171e; --surface:#171a21; --surface2:#1c2029; --text:#eceef2; --muted:#9a9fac; --faint:#626876;
  --border:#262a34; --border2:#323744; --accent:var(--accent-d,#e2c063); --accent-ink:#17130a;
  --cover:var(--cover-d,#0c0e1c); --paper:#1a1d25; --paper-line:#252935; --pocket:#14161d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 8px 28px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8),0 10px 30px -10px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  transition:background-color .35s var(--ease),color .35s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ── Header ─────────────────────────────── */
header.top{position:sticky;top:0;z-index:30;backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.top-inner{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;color:var(--accent-ink);
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.35)}
.brand h1{font-family:var(--title);font-weight:600;font-size:21px;margin:0;letter-spacing:.2px;white-space:nowrap}
.brand p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap}
.stats{display:flex;gap:6px;margin-left:auto}
.stat{padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);min-width:86px}
.stat b{display:block;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.value b{color:var(--accent)}
.gain-pos{color:#2f9e63}.gain-neg{color:#d0574b}
.actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  box-shadow:var(--shadow-sm);font-weight:550;font-size:13.5px;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--border2);background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:#d0574b}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn svg{width:17px;height:17px;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ── Toolbar ───────────────────────────── */
.toolbar{max-width:1400px;margin:0 auto;padding:16px 24px 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 260px;max-width:360px}
.search input{width:100%;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:0 34px 0 36px;outline:none;
  box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:10px;font:11px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.chips{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--bg2);border:1px solid var(--border)}
.chip{border:0;background:transparent;height:30px;padding:0 12px;border-radius:8px;font-weight:550;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;
  transition:background .2s,color .2s}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint))}
.chip:hover{color:var(--text)}
.chip.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:0 30px 0 12px;
  box-shadow:var(--shadow-sm);outline:none;font-size:13.5px;max-width:200px;text-overflow:ellipsis;cursor:pointer}
.sel select.set{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.sel::after{content:"";position:absolute;right:12px;top:16px;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.sel label{position:absolute;left:12px;top:-7px;font-size:10px;padding:0 4px;background:var(--bg);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-radius:4px}
.spacer{flex:1}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--bg2);border:1px solid var(--border)}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:550;font-size:13px;transition:all .2s var(--ease)}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.filterbar{max-width:1400px;margin:0 auto;padding:2px 24px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel.sm select{height:32px;font-size:12.5px;border-radius:9px;background:transparent;box-shadow:none;padding-right:28px}
.sel.sm::after{top:13px}
.sel.sm select.set{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.subbar{flex:1;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12.5px;min-height:32px;padding-left:4px}
.subbar .clear{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:30px;height:18px;border-radius:20px;background:var(--border2);position:relative;transition:background .2s;margin:0;cursor:pointer}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--accent)}.toggle input:checked::after{transform:translateX(12px)}

main{max-width:1400px;margin:0 auto;padding:14px 24px 80px}
.view{animation:fadeUp .45s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Card face ─────────────────────────── */
.cf{position:relative;aspect-ratio:var(--card-aspect);border-radius:5.5% / 3.8%;overflow:hidden;background:var(--surface2);isolation:isolate;
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 4px 10px -4px rgba(0,0,0,.25);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.cf img{width:100%;height:100%;object-fit:cover;display:block}
.cf .qty{position:absolute;right:6%;bottom:4.5%;z-index:3;background:rgba(10,10,14,.78);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;
  backdrop-filter:blur(6px);box-shadow:0 2px 6px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.cf.shiny::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s;mix-blend-mode:color-dodge;
  background:linear-gradient(115deg,transparent 20%,rgba(255,220,150,.35) 36%,rgba(140,220,255,.35) 46%,rgba(255,150,230,.3) 56%,transparent 72%);
  background-size:250% 250%;background-position:var(--sx,50%) var(--sy,50%)}
.cf.shiny:hover::after{opacity:1}
.ph{position:absolute;inset:0;padding:7% 7% 6%;display:flex;flex-direction:column;gap:5%;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 78%,#fff) 0%,var(--tc) 45%,color-mix(in srgb,var(--tc) 70%,#000) 100%);color:#fff}
.ph::before{content:"";position:absolute;inset:3%;border-radius:4%;border:1px solid rgba(255,255,255,.35);pointer-events:none}
.ph-name{font-family:var(--title);font-weight:700;font-size:clamp(8px,.62em + .3vw,13px);line-height:1.15;background:rgba(255,255,255,.9);color:#1b1b1f;padding:4% 6%;border-radius:3px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.ph-name span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ph-art{flex:1;border-radius:3px;display:grid;place-items:center;font-size:2.3em;color:rgba(255,255,255,.85);
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.28),rgba(0,0,0,.2) 75%),color-mix(in srgb,var(--tc) 60%,#222);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25),inset 0 0 18px rgba(0,0,0,.3)}
.ph-meta{display:flex;justify-content:space-between;gap:4px;font-size:clamp(7px,.5em + .2vw,10.5px);font-weight:650;letter-spacing:.02em;opacity:.95;white-space:nowrap;overflow:hidden}
.ph-meta span{overflow:hidden;text-overflow:ellipsis}
.ph-type{font-size:clamp(6.5px,.45em + .15vw,9.5px);text-transform:uppercase;letter-spacing:.12em;opacity:.85}

/* ── Binder ───────────────────────────── */
.binder-wrap{display:flex;align-items:center;gap:14px;justify-content:center;user-select:none;-webkit-user-select:none}
.flipbtn{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;
  transition:transform .2s var(--ease),opacity .2s}
.flipbtn:hover{transform:scale(1.07)}.flipbtn:active{transform:scale(.95)}
.flipbtn[disabled]{opacity:.25;pointer-events:none}
.flipbtn svg{width:20px;height:20px}
.binder{position:relative;padding:18px;border-radius:22px;background:var(--cover);
  background-image:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.09),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px);
  box-shadow:var(--shadow-lg),inset 0 0 0 1px rgba(255,255,255,.06),inset 0 2px 0 rgba(255,255,255,.07);
  width:100%;max-width:1180px}
.binder.single{max-width:560px}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;perspective:2600px}
.binder.single .spread{grid-template-columns:1fr}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);pointer-events:none;z-index:4;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.16) 40%,rgba(0,0,0,.24) 50%,rgba(0,0,0,.16) 60%,transparent)}
.binder.single .spread::after{display:none}
.page{position:relative;background:var(--paper);padding:4.2% 4.2% 3%;display:flex;flex-direction:column;gap:clamp(6px,1.4vw,12px);height:100%;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.page.left{border-radius:10px 3px 3px 10px}.page.right{border-radius:3px 10px 10px 3px}
.binder.single .page{border-radius:10px}
.page.left::before,.page.right::before{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none}
.page.left::before{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.05))}
.page.right::before{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.06))}
.page-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:18px;font-size:11.5px;color:var(--muted)}
.page-head b{font-family:var(--title);font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pockets{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:clamp(6px,1.8vw,14px)}
.pocket{position:relative;aspect-ratio:var(--card-aspect);border-radius:5px;background:var(--pocket);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.09),inset 0 0 0 1px rgba(0,0,0,.05)}
.pocket::after{content:"";position:absolute;inset:0;border-radius:5px;pointer-events:none;z-index:3;
  background:linear-gradient(125deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%);
  border-top:2px solid rgba(255,255,255,.35)}
[data-theme="dark"] .pocket::after{background:linear-gradient(125deg,rgba(255,255,255,.08) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.04));border-top-color:rgba(255,255,255,.07)}
.pocket .cf{position:absolute;inset:3.5%;cursor:pointer;aspect-ratio:auto}
@media (hover:hover){.pocket .cf:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 14px 26px -10px rgba(0,0,0,.45);z-index:2}}
.page-foot{text-align:center;font-size:10.5px;color:var(--faint);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:6;transition:transform .78s cubic-bezier(.55,.06,.3,1)}
.leaf.next{left:50%;transform-origin:0 50%}.leaf.next.go{transform:rotateY(-180deg)}
.leaf.prev{left:0;transform-origin:100% 50%}.leaf.prev.go{transform:rotateY(180deg)}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .78s;border-radius:inherit}
.leaf.next .face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.next .face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.prev .face.front::after{background:linear-gradient(270deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.prev .face.back::after{background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.go .face::after{opacity:1}
.spread.slide-next{animation:slideNext .45s var(--ease)}.spread.slide-prev{animation:slidePrev .45s var(--ease)}
@keyframes slideNext{from{opacity:0;transform:translateX(40px) rotateY(-8deg)}to{opacity:1;transform:none}}
@keyframes slidePrev{from{opacity:0;transform:translateX(-40px) rotateY(8deg)}to{opacity:1;transform:none}}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pager input[type=range]{width:min(360px,50vw);accent-color:var(--accent)}

/* ── Grid ─────────────────────────────── */
.group{margin-bottom:30px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.group-h h3{margin:0;font-family:var(--title);font-weight:600;font-size:18px}
.group-h span{color:var(--muted);font-size:12.5px}
.group-h .gv{margin-left:auto;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:22px 18px}
.tile{cursor:pointer;border-radius:12px;padding:0;border:0;background:none;text-align:left;animation:pop .4s var(--ease) both;animation-delay:calc(var(--i,0) * 14ms)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media (hover:hover){.tile:hover .cf{transform:translateY(-4px);box-shadow:0 18px 30px -14px rgba(0,0,0,.5)}}
.tile-info{padding:9px 2px 0}
.tile-name{font-weight:600;font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-meta{display:flex;justify-content:space-between;gap:6px;margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap}
.tile-meta>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-meta .price{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* ── List ─────────────────────────────── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:auto}
table.list{width:100%;border-collapse:collapse;font-size:13px}
.list th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
.list th.sorted{color:var(--accent)}
.list th .arr{display:inline-block;margin-left:4px;transition:transform .2s}
.list td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.list tr.row{cursor:pointer;transition:background .15s}
.list tr.row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.list tr.grp td{background:var(--bg2);font-family:var(--title);font-weight:600;font-size:13.5px;padding:8px 12px}
.list td.num{text-align:right;font-variant-numeric:tabular-nums}
.list .thumb{width:28px}
.list .thumb .cf{width:26px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.list .thumb .ph{padding:0}.list .thumb .ph>*,.list .thumb .qty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}

/* ── Empty state ──────────────────────── */
.empty{max-width:640px;margin:7vh auto 0;text-align:center;animation:fadeUp .6s var(--ease)}
.drop{border:1.5px dashed var(--border2);border-radius:24px;padding:46px 30px;background:var(--surface);box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.drop .stack{position:relative;height:120px;margin:0 auto 22px;width:200px}
.drop .stack .cf{position:absolute;width:76px;left:62px;top:0}
.drop .stack .cf:nth-child(1){transform:rotate(-14deg) translate(-56px,10px)}
.drop .stack .cf:nth-child(3){transform:rotate(14deg) translate(56px,10px)}
.empty h2{font-family:var(--title);font-weight:600;font-size:26px;margin:0 0 8px}

.d-head{display:flex;align-items:center;gap:8px;padding:14px 16px 0}

.d-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}

.qty-step{display:flex;align-items:center;gap:0;margin-top:12px;border:1px solid var(--border);border-radius:10px;width:max-content;overflow:hidden;background:var(--surface2)}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.field input:focus,.field select:focus,.field textarea:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 13%,transparent)}
.field .money{position:relative}.field .money input{padding-left:22px}.field .money::before{content:"$";position:absolute;left:10px;top:10px;color:var(--muted)}
.d-foot{display:flex;gap:8px;padding:14px 26px;border-top:1px solid var(--border);background:var(--surface2)}

/* ── Modal ────────────────────────────── */
.modal-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(10,10,15,.45);backdrop-filter:blur(4px);animation:fade .25s var(--ease)}

  animation:modalIn .4s var(--ease);overflow:hidden}

.m-head{padding:22px 26px 6px}

.map select{height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);padding:0 8px;width:100%;outline:none}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}

/* ── Menu / toast / overlay ───────────── */
.menu{position:fixed;z-index:50;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;animation:menuIn .2s var(--ease);transform-origin:top right}

.toast.out{animation:toastOut .3s var(--ease) forwards}

@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.dropover{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}

@media (max-width:1100px){.stats .stat.paid{display:none}}
/* ── Sheets, install hint, phone helpers (all sizes) ── */

.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(10,10,15,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s var(--ease)}

.sc-h{cursor:grab}.sc-h .hit{fill:transparent}.sc-h .dot{fill:var(--accent);stroke:#fff}
.sc-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sc-btns{display:flex;gap:6px;flex-wrap:wrap}
.sc-btns .btn svg{width:16px;height:16px}
.sh-note{margin:0 4px 8px;color:var(--muted);font-size:14px}
.sc-prog{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.sc-pt{font-weight:600;font-variant-numeric:tabular-nums}
.sc-bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}.sc-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}
.sc-cells{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px;max-width:560px;margin:0 auto;width:100%}
.sc-cell{position:relative;border-radius:8px;overflow:hidden;background:var(--surface2);aspect-ratio:var(--card-aspect);outline:3px solid transparent;transition:outline-color .2s}
.sc-cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:.55;transition:opacity .3s}
.sc-cell span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-cell.busy{outline-color:var(--accent)}.sc-cell.busy img{opacity:1}
.sc-cell[class*=" c-"] img{opacity:1}
.sc-cell.c-high{outline-color:#2f9e5b}.sc-cell.c-medium{outline-color:#c9a227}.sc-cell.c-low{outline-color:#e07b39}.sc-cell.c-none,.sc-cell.err{outline-color:#d0574b}
.sc-cell.empty img{opacity:.25}
.sc-off{text-align:center;padding:30px 10px;color:var(--muted)}.sc-off svg{width:40px;height:40px;color:var(--accent)}.sc-off h3{color:var(--text);margin:10px 0 4px;font-family:var(--title)}
.sc-defs{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sc-defs label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.sc-defs select{height:38px;min-width:150px}
.sc-defs .sc-chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--text);font-size:13.5px}
.sc-list{display:flex;flex-direction:column}
.sc-row{display:grid;grid-template-columns:28px 76px 76px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)}
.sc-row.off .sc-crop,.sc-row.off .sc-match,.sc-row.off .sc-info>*:not(.sc-find):not([data-find]){opacity:.45}
.sc-use{display:flex;align-items:center;justify-content:center;height:44px}.sc-use input{width:20px;height:20px;accent-color:var(--accent)}
.sc-crop,.sc-match img,.sc-noimg{width:76px;aspect-ratio:var(--card-aspect);object-fit:cover;border-radius:5px;box-shadow:var(--shadow-sm);display:block;background:var(--surface2)}
.sc-noimg{display:grid;place-items:center;color:var(--faint);font-size:12px;border:1px dashed var(--border2)}
.sc-info{min-width:0;display:flex;flex-direction:column;gap:5px}
.sc-top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.sc-top b{font-size:15px;overflow:hidden;text-overflow:ellipsis}
.sc-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.sc-conf{flex:none;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--muted)}
.sc-conf.high{background:rgba(47,158,91,.14);color:#2f9e5b}.sc-conf.medium{background:rgba(201,162,39,.16);color:#a27f12}
.sc-conf.low{background:rgba(224,123,57,.16);color:#c4621f}.sc-conf.none,.sc-conf.err{background:rgba(208,87,75,.14);color:#d0574b}
.sc-ctl{display:flex;gap:8px;align-items:center}
.sc-ctl select{flex:1;min-width:0;height:38px}
.sc-qty{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.sc-qty input{width:64px;height:38px}
.linkbtn{align-self:flex-start;border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.sc-find{display:flex;flex-direction:column;gap:8px}
.sc-frow{display:flex;gap:8px}.sc-frow input{flex:1;min-width:0;height:38px}
.sc-res{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.sc-hit{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:6px;color:var(--text);cursor:pointer}
.sc-hit img{width:34px;aspect-ratio:var(--card-aspect);object-fit:cover;border-radius:3px}
.sc-hit small{display:block;color:var(--muted);font-size:12px}
@media (max-width:860px){
  .modal.scan{max-height:96vh;max-height:96dvh}
  .sc-stage{min-height:200px}
  .sc-btns{width:100%}.sc-btns .btn{flex:1;justify-content:center;height:44px;padding:0 8px;min-width:0}
  .sc-btns .btn span{font-size:13px}
  .sc-layouts button{padding:0 4px;font-size:13px}
  .sc-row{grid-template-columns:26px 64px 64px minmax(0,1fr);gap:10px}
  .sc-crop,.sc-match img,.sc-noimg{width:64px}
  .sc-row .sc-info{grid-column:2 / -1}
  .sc-defs select{height:44px;font-size:16px;min-width:0;width:100%}
  .sc-defs label:not(.sc-chk){flex:1 1 40%}
  .sc-ctl select,.sc-qty input,.sc-frow input{height:44px;font-size:16px}
  .sc-frow .btn{height:44px}
  .linkbtn{min-height:44px}
  .sc-use input{width:24px;height:24px}
  .sc-hit{min-height:52px}
}

.sc-warn{font-size:12px;color:var(--warn,#b45309);margin:4px 0 0}
.sc-find[hidden],.sc-warn[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand"><div class="logo" id="logo"></div><div><h1 id="appTitle"></h1><p id="appSub"></p></div></div>
  <div class="stats" id="stats"></div>
  <div class="actions">
    <button class="btn primary" id="btnImport" title="Import files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14a2 2 0 0 0 2-2v-4M3 15v4a2 2 0 0 0 2 2"/></svg><span class="label">Import</span></button>
    <button class="btn icon" id="btnTheme" title="Toggle light / dark"></button>
    <button class="btn icon" id="btnMenu" title="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </div>
</div></header>
<div id="toolbarHost"></div>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" inert></aside>
<div class="toasts" id="toasts"></div>
<div class="dropover" id="dropover"><div><h2>Drop to add to your binder</h2><div class="muted">Exports, spreadsheets (CSV / XLSX), card photos, or a backup file</div></div></div>
<input type="file" id="filePick" multiple accept=".csv,.tsv,.txt,.xlsx,.json,text/csv,text/plain,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,image/*" hidden>
<input type="file" id="imgPick" accept="image/*" hidden>
<input type="file" id="camPick" accept="image/*" capture="environment" hidden>
<input type="file" id="photoPick" accept="image/*" multiple hidden>
<input type="file" id="dataPick" multiple accept=".csv,.tsv,.txt,.xlsx,.json,text/csv,text/comma-separated-values,text/tab-separated-values,text/plain,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<script>
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║                          ✦  CONFIG  ✦                                 ║
   ║  Everything game-specific lives in this one object. To make a binder  ║
   ║  for another card game, edit ONLY this block (see README.md).         ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
const CONFIG = {
  /* Storage namespace. Each binder needs its own id so collections never mix. */
  id: 'yugioh-binder',
  title: 'Yu-Gi-Oh! Binder',
  subtitle: 'My digital card binder',
  logo: '◈',                       // a glyph or emoji shown in the header and on cards without images
  currency: 'USD',
  locale: 'en-US',

  theme: {
    accentLight: '#a8821b',        // accent in light mode
    accentDark:  '#e2c063',        // accent in dark mode
    coverLight:  '#24284a',        // binder cover colour (light mode)
    coverDark:   '#0c0e1c',        // binder cover colour (dark mode)
    titleFont:   '"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif',
  },

  /* Physical card shape (width / height) and pockets per binder page. */
  cardAspect: '59 / 86',
  binder: { cols: 3, rows: 3 },

  /* Fields stored for every card.
     type: text | number | money | select | textarea
     aliases: spreadsheet headers that map to this field (case/punctuation-insensitive).
     suggest: list used for autocomplete in the editor ('rarities' | 'conditions' | 'subtypes' | array).
     hidden: kept on import/export but not shown in the editor. */
  fields: [
    { key: 'name',          label: 'Card name',      type: 'text',   required: true, aliases: ['Product Name', 'Name', 'Card Name', 'Card', 'Title', 'Item', 'Product'] },
    { key: 'set',           label: 'Set',            type: 'text',   aliases: ['Set', 'Set Name', 'Expansion', 'Booster', 'Pack', 'Release'] },
    { key: 'number',        label: 'Set code',       type: 'text',   mono: true, placeholder: 'LOB-EN001', aliases: ['Card Number', 'Set Code', 'Number', 'Card No', 'Card #', 'No', 'Code', 'Collector Number', 'Print Tag'] },
    { key: 'rarity',        label: 'Rarity',         type: 'text',   suggest: 'rarities', aliases: ['Rarity', 'Set Rarity', 'Printing Rarity'] },
    { key: 'edition',       label: 'Edition',        type: 'text',   suggest: ['1st Edition', 'Unlimited', 'Limited'], aliases: ['Variance', 'Edition', 'Printing', 'Variant', 'Print', 'Version'] },
    { key: 'cardType',      label: 'Card type',      type: 'select', aliases: ['Card Type', 'Type', 'Frame Type', 'Kind'] },
    { key: 'subtype',       label: 'Subtype',        type: 'text',   suggest: 'subtypes', aliases: ['Subtype', 'Sub Type', 'Monster Type', 'Property', 'Card Subtype', 'Spell Type', 'Trap Type'] },
    { key: 'condition',     label: 'Condition',      type: 'text',   suggest: 'conditions', aliases: ['Card Condition', 'Condition', 'Cond'] },
    { key: 'grade',         label: 'Grade',          type: 'text',   placeholder: 'Ungraded', aliases: ['Grade', 'Graded', 'Grading', 'Slab'] },
    { key: 'quantity',      label: 'Quantity',       type: 'number', default: 1, aliases: ['Quantity', 'Qty', 'Count', 'Copies', 'Total Quantity', 'Amount', 'Owned'] },
    { key: 'marketPrice',   label: 'Market price',   type: 'money',  aliases: ['Market Price', 'Market Value', 'Price', 'Value', 'TCG Market Price', 'Current Price', 'Market'] },
    { key: 'priceOverride', label: 'Price override', type: 'money',  aliases: ['Price Override', 'Custom Price', 'My Price', 'Override'] },
    { key: 'pricePaid',     label: 'Price paid',     type: 'money',  aliases: ['Average Cost Paid', 'Price Paid', 'Cost Paid', 'Cost', 'Purchase Price', 'Paid', 'Cost Basis', 'Buy Price'] },
    { key: 'portfolio',     label: 'Portfolio',      type: 'text',   aliases: ['Portfolio Name', 'Portfolio', 'Binder', 'Collection', 'Folder', 'Location'] },
    { key: 'category',      label: 'Game',           type: 'text',   hidden: true, aliases: ['Category', 'Game', 'Product Line', 'TCG'] },
    { key: 'dateAdded',     label: 'Date added',     type: 'text',   aliases: ['Date Added', 'Added', 'Date', 'Acquired', 'Added On'] },
    { key: 'notes',         label: 'Notes',          type: 'textarea', aliases: ['Notes', 'Note', 'Comments', 'Comment'] },
  ],

  /* Fields that decide "same card" when re-importing (duplicates merge, quantities update). */
  identity: ['name', 'set', 'number', 'edition', 'condition', 'grade'],

  /* Which field holds the card type, and the types with their colours and subtypes. */
  typeField: 'cardType',
  subtypeField: 'subtype',
  cardTypes: [
    { value: 'Monster', color: '#c27a2c', subtypes: ['Normal', 'Effect', 'Ritual', 'Fusion', 'Synchro', 'Xyz', 'Pendulum', 'Link', 'Token'] },
    { value: 'Spell',   color: '#1c9a8a', subtypes: ['Normal', 'Quick-Play', 'Continuous', 'Equip', 'Field', 'Ritual'] },
    { value: 'Trap',    color: '#b4457e', subtypes: ['Normal', 'Continuous', 'Counter'] },
  ],

  /* Low → high. Used for sorting and grouping by rarity. */
  rarities: ['Common', 'Short Print', 'Rare', 'Super Rare', 'Ultra Rare', 'Ultimate Rare', 'Secret Rare', 'Prismatic Secret Rare',
             'Platinum Secret Rare', 'Gold Rare', 'Premium Gold Rare', 'Ghost Rare', "Collector's Rare", 'Starlight Rare', 'Quarter Century Secret Rare'],
  rarityShort: { 'Common': 'C', 'Short Print': 'SP', 'Rare': 'R', 'Super Rare': 'SR', 'Ultra Rare': 'UR', 'Ultimate Rare': 'UtR', 'Secret Rare': 'ScR',
                 'Prismatic Secret Rare': 'PScR', 'Platinum Secret Rare': 'PlScR', 'Gold Rare': 'GR', 'Premium Gold Rare': 'PGR', 'Ghost Rare': 'GhR',
                 "Collector's Rare": 'CR', 'Starlight Rare': 'StR', 'Quarter Century Secret Rare': 'QCScR' },
  shinyRarities: /super|ultra|ultimate|secret|ghost|gold|starlight|collector|platinum|prismatic|quarter/i,

  /* Best → worst. */
  conditions: ['Mint', 'Near Mint', 'Lightly Played', 'Moderately Played', 'Heavily Played', 'Damaged'],

  /* Sort menu. kind: text | number | value | order (order: 'rarities' | 'conditions' | 'types'). */
  sortOptions: [
    { key: 'name',      label: 'Name (A–Z)',   field: 'name' },
    { key: 'number',    label: 'Set code',     field: 'number' },
    { key: 'set',       label: 'Set',          field: 'set' },
    { key: 'type',      label: 'Card type',    field: 'cardType', kind: 'order', order: 'types' },
    { key: 'rarity',    label: 'Rarity',       field: 'rarity',   kind: 'order', order: 'rarities', defaultDir: -1 },
    { key: 'value',     label: 'Value',        kind: 'value', defaultDir: -1 },
    { key: 'quantity',  label: 'Quantity',     field: 'quantity', kind: 'number', defaultDir: -1 },
    { key: 'condition', label: 'Condition',    field: 'condition', kind: 'order', order: 'conditions' },
    { key: 'added',     label: 'Date added',   field: 'dateAdded', defaultDir: -1 },
  ],
  /* Group menu (binder view can start each group on a fresh page). */
  groupOptions: [
    { key: 'none',      label: 'No grouping' },
    { key: 'type',      label: 'Card type',  field: 'cardType', kind: 'order', order: 'types' },
    { key: 'set',       label: 'Set',        field: 'set' },
    { key: 'rarity',    label: 'Rarity',     field: 'rarity', kind: 'order', order: 'rarities' },
    { key: 'letter',    label: 'First letter', field: 'name', kind: 'letter' },
    { key: 'value',     label: 'Value band', kind: 'valueBand' },
    { key: 'portfolio', label: 'Portfolio',  field: 'portfolio' },
  ],
  valueBands: [100, 25, 5, 1],

  /* Dropdown filters in the toolbar (type chips are automatic). */
  filters: [
    { field: 'set',       label: 'All sets' },
    { field: 'rarity',    label: 'All rarities' },
    { field: 'condition', label: 'All conditions' },
    { field: 'portfolio', label: 'All portfolios' },
  ],
  searchFields: ['name', 'set', 'number', 'rarity', 'cardType', 'subtype', 'edition', 'notes'],
  listColumns: ['name', 'number', 'set', 'rarity', 'cardType', 'edition', 'condition', 'quantity', 'value'],

  /* What a card shows when it has no image, and the small line under grid tiles. */
  face: { title: 'name', code: 'number', badge: 'edition' },
  tileMeta: ['number', 'rarity'],

  /* Value used for totals: price override if set, otherwise market price. */
  cardValue: c => (Number(c.priceOverride) > 0 ? Number(c.priceOverride) : Number(c.marketPrice) || 0),

  /* Recognise known export formats by their headers (purely cosmetic: shows a badge). */
  sources: [
    { name: 'Collectr', headers: ['Portfolio Name', 'Category', 'Variance'] },
    { name: 'TCGplayer', headers: ['TCGplayer Id', 'Product Line'] },
  ],
  /* Multi-game exports: offer to import only matching rows. */
  importFilter: { field: 'category', match: /yu-?gi-?oh|ygo/i, label: 'Only import Yu-Gi-Oh! rows' },

  /* Helps match photo filenames to cards (e.g. "LOB-EN001 blue eyes.jpg"). */
  numberPattern: /\b[A-Z0-9]{2,5}-[A-Z]{0,2}\d{2,3}\b/i,

  /* Optional online enrichment (card type, subtype and artwork) from the free YGOPRODeck API.
     The binder works fully offline without it. Set to null to remove the feature. */
  lookup: {
    label: 'Fill card types & art (YGOPRODeck)',
    note: 'Looks up each card by name on db.ygoprodeck.com. Art is linked from YGOPRODeck, so it needs internet to display; your own photos are stored offline.',
    needs: c => !c.cardType || (!c.imageId && !c.imageUrl),
    async fetch(card) {
      let d = await YGO.cardByName(card.name);
      if (!d) { const r = await YGO.get('cardinfo.php?fname=' + encodeURIComponent(card.name)); d = r?.data?.[0]; }
      if (!d) return null;
      const out = YGO.fields(d);
      const s = (d.card_sets || []).find(s => card.number && s.set_code.toLowerCase() === String(card.number).toLowerCase());
      if (s) { if (!card.set) out.set = s.set_name; if (!card.rarity) out.rarity = s.set_rarity; }
      return out;
    },
  },

  /* "Scan binder page": photograph a binder page (or a few cards), the app reads each card's set code
     (e.g. LOB-EN001, printed under the art on the right) and its name, and looks the exact printing up
     on YGOPRODeck. Remove this block (or set scan: null) to turn the feature off. The engine (photo
     framing, OCR, review screen) is generic; everything Yu-Gi-Oh!-specific is here and in YGO below. */
  scan: {
    label: 'Scan binder page',
    note: 'Reads each card\'s set code and name with on-device text recognition, then finds the exact printing on db.ygoprodeck.com.',
    /* Where text sits on a card, as fractions of the card (x, y, width, height). Tried in order. */
    codeRegions: [
      { x: .47, y: .69, w: .46, h: .075, line: .022, ink: [.010, .028] },          // standard: right side, just under the art
      { x: .07, y: .69, w: .46, h: .075, line: .022, ink: [.010, .028] },          // Pendulum cards (and some others) print it on the left
      { x: .36, y: .64, w: .62, h: .17, psm: 6 },             // looser box for photos that are off (the code is picked out of the text)
    ],
    nameRegion: { x: .05, y: .02, w: .76, h: .11, line: .045 },
    codeChars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
    /* Quick offline check: does this OCR text contain something that looks like a set code? */
    looksLikeCode: t => YGO.codeCandidates(t).some(c => c.score <= 1),
    prepare: () => YGO.prefixes(),                         // runs once per scan (needs internet the first time)
    identify: r => YGO.identify(r),                        // ({ codeTexts, nameText }) → result (see YGO.identify)
    search: q => YGO.search(q),                            // manual fix in the review screen
    toCard: (m, p) => YGO.toCard(m, p),                    // match + chosen printing → binder fields
  },

  /** 0..1 similarity of an OCR'd name with a real card name (forgiving about punctuation, case and spacing). */

/* On phones, hand files to the share sheet (Files, AirDrop, Drive, email…); otherwise download. */
async function deliverFile(name, data, type, title) {
  if (isPhone() && navigator.canShare && navigator.share) {
    let file = null;
    for (const t of [type, 'text/plain']) { try { const f = new File([data], name, { type: t }); if (navigator.canShare({ files: [f] })) { file = f; break; } } catch {} }
    if (file) {
      const tryShare = async () => { try { await navigator.share({ files: [file], title }); return 'shared'; }
        catch (e) { return e.name === 'AbortError' ? 'cancelled' : e.name === 'NotAllowedError' ? 'retry' : 'fail'; } };
      let r = await tryShare();
      if (r === 'retry') {   // the tap "expired" while the file was being prepared, so ask for a fresh tap
        const v = await ask(title, 'Your file is ready. Share it to Files, AirDrop, Google Drive, email or another app, or download it.', [{ label: 'Download', value: 'dl' }, { label: 'Share…', value: 'share', cls: 'primary' }]);
        r = v === 'share' ? await tryShare() : v === 'dl' ? 'fail' : 'cancelled';
      }
      if (r === 'shared' || r === 'cancelled') return r;
    }
  }
  download(name, data, type); return 'downloaded';
}

async function restoreBackup(file, forced) {

    [{ label: 'Cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace', value: 'replace', cls: 'primary' }]);
  if (!choice) return;
  if (choice === 'replace') { await DB.clear('cards'); await DB.clear('images'); S.imgs.forEach(u => URL.revokeObjectURL(u)); S.imgs.clear(); S.cards = []; }
  for (const [k, d] of Object.entries(data.images || {})) { const b = await (await fetch(d)).blob(); await DB.put('images', b, k); if (S.imgs.has(k)) URL.revokeObjectURL(S.imgs.get(k)); S.imgs.set(k, URL.createObjectURL(b)); }
  const byId = new Map(S.cards.map(c => [c.id, c])), changed = [];
  for (const c of data.cards) { if (!c.id) c.id = uid(); const ex = byId.get(c.id); if (ex) Object.assign(ex, c); else { S.cards.push(c); byId.set(c.id, c); } changed.push(byId.get(c.id)); }

}
function toCSV() {
  const list = sortCards(filtered()), cols = FIELDS.filter(f => f.export !== false);
  const q = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [[...cols.map(f => f.label), 'Value', 'Total Value', 'Image'].map(q).join(',')];
  list.forEach(c => lines.push([...cols.map(f => c[f.key]), valueOf(c).toFixed(2), (valueOf(c) * qtyOf(c)).toFixed(2), c.imageUrl || (c.imageId ? '(photo stored in binder)' : '')].map(q).join(',')));
  return { csv: '\uFEFF' + lines.join('\r\n'), count: list.length };

async function lookupOne(c, force) {
  try { const r = await CONFIG.lookup.fetch(c); if (!r) return false;
    for (const [k, v] of Object.entries(r)) if (v && (force || !c[k] || k === 'imageUrl')) c[k] = v;
    c.updatedAt = Date.now(); await DB.put('cards', c); return true; } catch (e) { console.warn('lookup failed', c.name, e); return false; }
}
async function lookupAll(skipAsk) {
  const todo = S.cards.filter(c => CONFIG.lookup.needs(c));
  if (!todo.length) { toast('Every card already has its info.'); return; }
  if (!skipAsk && !await ask(CONFIG.lookup.label, `${esc(CONFIG.lookup.note || '')}<br><br>${todo.length} card${todo.length > 1 ? 's' : ''} need info. Continue?`, [{ label: 'Cancel' }, { label: 'Look up', value: true, cls: 'primary' }])) return;
  const t = toast(`Looking up… 0 / ${todo.length}`, 0); let ok = 0, i = 0, done = 0;
  const cache = new Map();
  const worker = async () => { while (i < todo.length) { const c = todo[i++]; if (await lookupOne(c)) ok++; done++; t.firstChild.textContent = `Looking up… ${done} / ${todo.length}`; await sleep(120); } };
  await Promise.all([worker(), worker(), worker()]);
  t.dismiss(); renderToolbar(); renderMain(); toast(ok ? `Updated <b>${ok}</b> of ${todo.length} cards` : 'Couldn\'t reach the lookup service. Are you online?', 4500);
}

  const key = e => { if (e.key === 'Escape') { e.stopPropagation(); api.onclose && api.onclose(); api.close(); } };
  document.addEventListener('keydown', key, true);

  if (isPhone()) dragToClose($('.modal', back), [$('.m-head', back)].filter(Boolean), () => { api.onclose && api.onclose(); api.close(); });

function sheet(inner) {

function dragToClose(panel, handles, onClose) {
  handles.forEach(h => {
    h.style.touchAction = 'none';
    h.addEventListener('pointerdown', e => {
      if (e.target.closest('button,select,input,a,textarea')) return;
      const y0 = e.clientY; let dy = 0; panel.classList.add('dragging'); try { h.setPointerCapture(e.pointerId); } catch {}
      const mv = ev => { dy = Math.max(0, ev.clientY - y0); panel.style.transform = `translateY(${dy}px)`; };
      const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
        panel.classList.remove('dragging'); panel.style.transform = ''; if (dy > 90) onClose(); };
      h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    });
  });
}

  { key: '2x2', label: '2 × 2', cols: 2, rows: 2 }, { key: '1', label: '1 card', cols: 1, rows: 1 },

  worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/',

/* ── geometry: homographies between quads ── */
function solveLin(A, b) {
  const n = b.length, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]]; if (Math.abs(M[c][c]) < 1e-12) return null;
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
