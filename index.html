<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yu-Gi-Oh! Binder</title>
<meta name="description" content="My Yu-Gi-Oh! card collection as a digital binder. Works offline.">
<meta name="theme-color" content="#a8821b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YGO Binder">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<script>window.BINDER_PWA = { sw: './sw.js' };</script>
<style>
:root{
  --bg:#f4f2ec; --bg2:#ebe7dd; --surface:#ffffff; --surface2:#f8f6f1; --text:#1d1e23; --muted:#6c6f79; --faint:#a3a5ad;
  --border:#e4dfd3; --border2:#d6d0c2; --accent:var(--accent-l,#8a6d1c); --accent-ink:#fff;
  --cover:var(--cover-l,#262a48); --paper:#fbfaf6; --paper-line:#ece7db; --pocket:#f1eee6;
  --shadow-sm:0 1px 2px rgba(30,25,10,.06),0 1px 1px rgba(30,25,10,.04);
  --shadow:0 6px 24px -8px rgba(30,25,10,.18),0 2px 6px rgba(30,25,10,.06);
  --shadow-lg:0 30px 80px -20px rgba(15,12,5,.35),0 10px 30px -10px rgba(15,12,5,.2);
  --r:14px; --r-sm:9px; --ease:cubic-bezier(.22,.8,.25,1);
  --sans:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --title:Georgia,serif;
  --card-aspect:59/86;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0e1015; --bg2:#14171e; --surface:#171a21; --surface2:#1c2029; --text:#eceef2; --muted:#9a9fac; --faint:#626876;
  --border:#262a34; --border2:#323744; --accent:var(--accent-d,#e2c063); --accent-ink:#17130a;
  --cover:var(--cover-d,#0c0e1c); --paper:#1a1d25; --paper-line:#252935; --pocket:#14161d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 8px 28px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8),0 10px 30px -10px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  transition:background-color .35s var(--ease),color .35s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ── Header ─────────────────────────────── */
header.top{position:sticky;top:0;z-index:30;backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.top-inner{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;color:var(--accent-ink);
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent));box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.35)}
.brand h1{font-family:var(--title);font-weight:600;font-size:21px;margin:0;letter-spacing:.2px;white-space:nowrap}
.brand p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap}
.stats{display:flex;gap:6px;margin-left:auto}
.stat{padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);min-width:86px}
.stat b{display:block;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.value b{color:var(--accent)}
.gain-pos{color:#2f9e63}.gain-neg{color:#d0574b}
.actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  box-shadow:var(--shadow-sm);font-weight:550;font-size:13.5px;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--border2);background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:#d0574b}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn svg{width:17px;height:17px;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ── Toolbar ───────────────────────────── */
.toolbar{max-width:1400px;margin:0 auto;padding:16px 24px 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 260px;max-width:360px}
.search input{width:100%;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:0 34px 0 36px;outline:none;
  box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:10px;font:11px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.chips{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--bg2);border:1px solid var(--border)}
.chip{border:0;background:transparent;height:30px;padding:0 12px;border-radius:8px;font-weight:550;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;
  transition:background .2s,color .2s}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint))}
.chip:hover{color:var(--text)}
.chip.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:0 30px 0 12px;
  box-shadow:var(--shadow-sm);outline:none;font-size:13.5px;max-width:200px;text-overflow:ellipsis;cursor:pointer}
.sel select.set{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.sel::after{content:"";position:absolute;right:12px;top:16px;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.sel label{position:absolute;left:12px;top:-7px;font-size:10px;padding:0 4px;background:var(--bg);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border-radius:4px}
.spacer{flex:1}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--bg2);border:1px solid var(--border)}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:550;font-size:13px;transition:all .2s var(--ease)}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.filterbar{max-width:1400px;margin:0 auto;padding:2px 24px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel.sm select{height:32px;font-size:12.5px;border-radius:9px;background:transparent;box-shadow:none;padding-right:28px}
.sel.sm::after{top:13px}
.sel.sm select.set{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.subbar{flex:1;display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12.5px;min-height:32px;padding-left:4px}
.subbar .clear{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:30px;height:18px;border-radius:20px;background:var(--border2);position:relative;transition:background .2s;margin:0;cursor:pointer}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--accent)}.toggle input:checked::after{transform:translateX(12px)}

main{max-width:1400px;margin:0 auto;padding:14px 24px 80px}
.view{animation:fadeUp .45s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Card face ─────────────────────────── */
.cf{position:relative;aspect-ratio:var(--card-aspect);border-radius:5.5% / 3.8%;overflow:hidden;background:var(--surface2);isolation:isolate;
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 4px 10px -4px rgba(0,0,0,.25);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.cf img{width:100%;height:100%;object-fit:cover;display:block}
.cf .qty{position:absolute;right:6%;bottom:4.5%;z-index:3;background:rgba(10,10,14,.78);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;
  backdrop-filter:blur(6px);box-shadow:0 2px 6px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.cf.shiny::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s;mix-blend-mode:color-dodge;
  background:linear-gradient(115deg,transparent 20%,rgba(255,220,150,.35) 36%,rgba(140,220,255,.35) 46%,rgba(255,150,230,.3) 56%,transparent 72%);
  background-size:250% 250%;background-position:var(--sx,50%) var(--sy,50%)}
.cf.shiny:hover::after{opacity:1}
.ph{position:absolute;inset:0;padding:7% 7% 6%;display:flex;flex-direction:column;gap:5%;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 78%,#fff) 0%,var(--tc) 45%,color-mix(in srgb,var(--tc) 70%,#000) 100%);color:#fff}
.ph::before{content:"";position:absolute;inset:3%;border-radius:4%;border:1px solid rgba(255,255,255,.35);pointer-events:none}
.ph-name{font-family:var(--title);font-weight:700;font-size:clamp(8px,.62em + .3vw,13px);line-height:1.15;background:rgba(255,255,255,.9);color:#1b1b1f;padding:4% 6%;border-radius:3px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.ph-name span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ph-art{flex:1;border-radius:3px;display:grid;place-items:center;font-size:2.3em;color:rgba(255,255,255,.85);
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.28),rgba(0,0,0,.2) 75%),color-mix(in srgb,var(--tc) 60%,#222);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25),inset 0 0 18px rgba(0,0,0,.3)}
.ph-meta{display:flex;justify-content:space-between;gap:4px;font-size:clamp(7px,.5em + .2vw,10.5px);font-weight:650;letter-spacing:.02em;opacity:.95;white-space:nowrap;overflow:hidden}
.ph-meta span{overflow:hidden;text-overflow:ellipsis}
.ph-type{font-size:clamp(6.5px,.45em + .15vw,9.5px);text-transform:uppercase;letter-spacing:.12em;opacity:.85}

/* ── Binder ───────────────────────────── */
.binder-wrap{display:flex;align-items:center;gap:14px;justify-content:center;user-select:none;-webkit-user-select:none}
.flipbtn{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;
  transition:transform .2s var(--ease),opacity .2s}
.flipbtn:hover{transform:scale(1.07)}.flipbtn:active{transform:scale(.95)}
.flipbtn[disabled]{opacity:.25;pointer-events:none}
.flipbtn svg{width:20px;height:20px}
.binder{position:relative;padding:18px;border-radius:22px;background:var(--cover);
  background-image:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.09),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px);
  box-shadow:var(--shadow-lg),inset 0 0 0 1px rgba(255,255,255,.06),inset 0 2px 0 rgba(255,255,255,.07);
  width:100%;max-width:1180px}
.binder.single{max-width:560px}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;perspective:2600px}
.binder.single .spread{grid-template-columns:1fr}
.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);pointer-events:none;z-index:4;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.16) 40%,rgba(0,0,0,.24) 50%,rgba(0,0,0,.16) 60%,transparent)}
.binder.single .spread::after{display:none}
.page{position:relative;background:var(--paper);padding:4.2% 4.2% 3%;display:flex;flex-direction:column;gap:clamp(6px,1.4vw,12px);height:100%;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.page.left{border-radius:10px 3px 3px 10px}.page.right{border-radius:3px 10px 10px 3px}
.binder.single .page{border-radius:10px}
.page.left::before,.page.right::before{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none}
.page.left::before{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.05))}
.page.right::before{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.06))}
.page-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:18px;font-size:11.5px;color:var(--muted)}
.page-head b{font-family:var(--title);font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pockets{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:clamp(6px,1.8vw,14px)}
.pocket{position:relative;aspect-ratio:var(--card-aspect);border-radius:5px;background:var(--pocket);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.09),inset 0 0 0 1px rgba(0,0,0,.05)}
.pocket::after{content:"";position:absolute;inset:0;border-radius:5px;pointer-events:none;z-index:3;
  background:linear-gradient(125deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%);
  border-top:2px solid rgba(255,255,255,.35)}
[data-theme="dark"] .pocket::after{background:linear-gradient(125deg,rgba(255,255,255,.08) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.04));border-top-color:rgba(255,255,255,.07)}
.pocket .cf{position:absolute;inset:3.5%;cursor:pointer;aspect-ratio:auto}
@media (hover:hover){.pocket .cf:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 14px 26px -10px rgba(0,0,0,.45);z-index:2}}
.page-foot{text-align:center;font-size:10.5px;color:var(--faint);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:6;transition:transform .78s cubic-bezier(.55,.06,.3,1)}
.leaf.next{left:50%;transform-origin:0 50%}.leaf.next.go{transform:rotateY(-180deg)}
.leaf.prev{left:0;transform-origin:100% 50%}.leaf.prev.go{transform:rotateY(180deg)}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .78s;border-radius:inherit}
.leaf.next .face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.next .face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.prev .face.front::after{background:linear-gradient(270deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.prev .face.back::after{background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.go .face::after{opacity:1}
.spread.slide-next{animation:slideNext .45s var(--ease)}.spread.slide-prev{animation:slidePrev .45s var(--ease)}
@keyframes slideNext{from{opacity:0;transform:translateX(40px) rotateY(-8deg)}to{opacity:1;transform:none}}
@keyframes slidePrev{from{opacity:0;transform:translateX(-40px) rotateY(8deg)}to{opacity:1;transform:none}}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pager input[type=range]{width:min(360px,50vw);accent-color:var(--accent)}

/* ── Grid ─────────────────────────────── */
.group{margin-bottom:30px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.group-h h3{margin:0;font-family:var(--title);font-weight:600;font-size:18px}
.group-h span{color:var(--muted);font-size:12.5px}
.group-h .gv{margin-left:auto;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:22px 18px}
.tile{cursor:pointer;border-radius:12px;padding:0;border:0;background:none;text-align:left;animation:pop .4s var(--ease) both;animation-delay:calc(var(--i,0) * 14ms)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media (hover:hover){.tile:hover .cf{transform:translateY(-4px);box-shadow:0 18px 30px -14px rgba(0,0,0,.5)}}
.tile-info{padding:9px 2px 0}
.tile-name{font-weight:600;font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-meta{display:flex;justify-content:space-between;gap:6px;margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap}
.tile-meta>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-meta .price{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* ── List ─────────────────────────────── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:auto}
table.list{width:100%;border-collapse:collapse;font-size:13px}
.list th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
.list th.sorted{color:var(--accent)}
.list th .arr{display:inline-block;margin-left:4px;transition:transform .2s}
.list td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.list tr.row{cursor:pointer;transition:background .15s}
.list tr.row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.list tr.grp td{background:var(--bg2);font-family:var(--title);font-weight:600;font-size:13.5px;padding:8px 12px}
.list td.num{text-align:right;font-variant-numeric:tabular-nums}
.list .thumb{width:28px}
.list .thumb .cf{width:26px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.list .thumb .ph{padding:0}.list .thumb .ph>*,.list .thumb .qty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:550}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}

/* ── Empty state ──────────────────────── */
.empty{max-width:640px;margin:7vh auto 0;text-align:center;animation:fadeUp .6s var(--ease)}
.drop{border:1.5px dashed var(--border2);border-radius:24px;padding:46px 30px;background:var(--surface);box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.drop .stack{position:relative;height:120px;margin:0 auto 22px;width:200px}
.drop .stack .cf{position:absolute;width:76px;left:62px;top:0}
.drop .stack .cf:nth-child(1){transform:rotate(-14deg) translate(-56px,10px)}
.drop .stack .cf:nth-child(3){transform:rotate(14deg) translate(56px,10px)}
.empty h2{font-family:var(--title);font-weight:600;font-size:26px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 auto 22px;max-width:440px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty small{display:block;margin-top:18px;color:var(--faint);font-size:12px}
.noresults{text-align:center;color:var(--muted);padding:80px 0}

/* ── Drawer ───────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,10,15,.38);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:41;background:var(--surface);box-shadow:var(--shadow-lg);
  transform:translateX(104%);transition:transform .45s var(--ease);display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.d-head .grow{flex:1}
.d-body{overflow:auto;padding:6px 26px 30px;flex:1}
.d-hero{display:flex;gap:22px;align-items:flex-start;margin:6px 0 20px}
.d-img{width:168px;flex:none;perspective:800px}
.d-img .cf{transition:transform .2s ease-out,box-shadow .3s;box-shadow:0 20px 40px -16px rgba(0,0,0,.5);cursor:grab}
.d-img.dragover .cf{outline:2px dashed var(--accent);outline-offset:4px}
.d-img-actions{display:flex;gap:4px;margin-top:10px;justify-content:center}
.d-img-actions .btn{height:28px;font-size:12px;padding:0 9px}
.d-title{flex:1;min-width:0}
.d-title input{width:100%;border:0;background:transparent;font-family:var(--title);font-size:24px;font-weight:600;line-height:1.2;padding:4px 0;outline:none;border-bottom:1px solid transparent}
.d-title input:focus{border-bottom-color:var(--accent)}
.d-sub{color:var(--muted);font-size:13px;margin-top:2px}
.d-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.kpi span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi b{font-size:15.5px;font-variant-numeric:tabular-nums}
.qty-step{display:flex;align-items:center;gap:0;margin-top:12px;border:1px solid var(--border);border-radius:10px;width:max-content;overflow:hidden;background:var(--surface2)}
.qty-step button{width:34px;height:32px;border:0;background:transparent;font-size:16px}
.qty-step button:hover{background:var(--bg2)}
.qty-step input{width:46px;height:32px;border:0;text-align:center;background:transparent;font-weight:650;outline:none;-moz-appearance:textfield}
.qty-step input::-webkit-inner-spin-button{display:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);padding:0 11px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
.field textarea{height:76px;padding:9px 11px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 13%,transparent)}
.field .money{position:relative}.field .money input{padding-left:22px}.field .money::before{content:"$";position:absolute;left:10px;top:10px;color:var(--muted)}
.d-foot{display:flex;gap:8px;padding:14px 26px;border-top:1px solid var(--border);background:var(--surface2)}
.d-foot .grow{flex:1}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* ── Modal ────────────────────────────── */
.modal-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(10,10,15,.45);backdrop-filter:blur(4px);animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0}}
.modal{width:min(720px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--border);
  animation:modalIn .4s var(--ease);overflow:hidden}
.modal.sm{width:min(440px,100%)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
.m-head{padding:22px 26px 6px}
.m-head h2{margin:0;font-family:var(--title);font-weight:600;font-size:21px}
.m-head p{margin:5px 0 0;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);margin-left:8px;vertical-align:3px;font-family:var(--sans)}
.m-body{padding:14px 26px;overflow:auto}
.m-foot{padding:16px 26px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);background:var(--surface2);align-items:center}
.m-foot .grow{flex:1}
.map{display:grid;grid-template-columns:150px 1fr 1fr;gap:6px 14px;align-items:center}
.map .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-bottom:4px}
.map .lbl{font-weight:550}
.map .lbl em{color:#d0574b;font-style:normal}
.map select{height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);padding:0 8px;width:100%;outline:none}
.map select.auto{border-color:color-mix(in srgb,#2f9e63 45%,var(--border))}
.map .ex{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}
.opts .radio{display:flex;gap:16px;flex-wrap:wrap}
.opts label{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.opts input[type=radio],.opts input[type=checkbox]{accent-color:var(--accent)}
details.adv summary{cursor:pointer;color:var(--accent);font-weight:600;margin:4px 0 12px;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
.imgs{display:flex;flex-direction:column;gap:10px}
.imgrow{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--surface2)}
.imgrow img{width:64px;aspect-ratio:var(--card-aspect);object-fit:cover;border-radius:4px;box-shadow:var(--shadow-sm)}
.imgrow .fs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.imgrow .fs input,.imgrow select{height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:0 9px;outline:none;width:100%;min-width:0}
.imgrow select{grid-column:1/-1;margin-bottom:6px}

/* ── Menu / toast / overlay ───────────── */
.menu{position:fixed;z-index:50;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;animation:menuIn .2s var(--ease);transform-origin:top right}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:9px 11px;border-radius:9px;text-align:left;font-size:13.5px}
.menu button:hover{background:var(--surface2)}
.menu button svg{width:16px;height:16px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 4px}
.menu .danger{color:#d0574b}.menu .danger svg{color:#d0574b}
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1d1f26;color:#f2f2f4;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:toastIn .35s var(--ease);display:flex;gap:10px;align-items:center;max-width:90vw}
[data-theme="dark"] .toast{background:#2a2e39}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.toast b{color:var(--accent-d,#e2c063)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.dropover{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
.dropover.on{opacity:1}
.dropover div{border:2px dashed var(--accent);border-radius:28px;padding:60px 80px;text-align:center;background:var(--surface);box-shadow:var(--shadow-lg);transform:scale(.96);transition:transform .3s var(--ease)}
.dropover.on div{transform:none}
.dropover h2{font-family:var(--title);font-weight:600;margin:0 0 6px}

@media (max-width:1100px){.stats .stat.paid{display:none}}
/* ── Sheets, install hint, phone helpers (all sizes) ── */
.mob-only{display:none!important}
.badge-n{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.badge-n[hidden]{display:none}
#filtBtn{position:relative}
.pmid{display:flex;align-items:center;gap:14px}
.list .sub{display:none}
.toast .tbtn{pointer-events:auto;border:0;border-radius:8px;background:var(--accent-d,#e2c063);color:#17130a;font-weight:650;padding:6px 12px;margin-left:4px}
.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(10,10,15,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s var(--ease)}
.sheet-back.out{animation:fadeOut .26s var(--ease) forwards}
@keyframes fadeOut{to{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);
  padding:4px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));animation:sheetIn .38s var(--ease);transition:transform .3s var(--ease)}
.sheet.dragging,.drawer.dragging{transition:none}
.sheet-back.out .sheet{animation:sheetOut .26s var(--ease) forwards}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--border2);margin:8px auto 6px;touch-action:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px;touch-action:none}
.sh-head h3{margin:0;font-family:var(--title);font-size:20px;font-weight:600}
.sh-head .btn{height:44px}
.sh-sec{padding:12px 0;border-top:1px solid var(--border)}
.sh-t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.sh-row{display:flex;gap:8px;align-items:center}
.sheet .sel{flex:1;width:100%}
.sheet .sel select{width:100%;max-width:none;height:46px;font-size:16px}
.sheet .sel::after{top:19px}
.sheet .chips{flex-wrap:wrap;background:none;border:0;padding:0;gap:8px}
.sheet .chip{height:44px;padding:0 16px;border:1px solid var(--border);background:var(--surface2);font-size:14.5px}
.sheet .chip.on{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.sheet .btn.icon{width:46px;height:46px}
.sheet .toggle{min-height:44px}
.sh-foot{display:flex;gap:8px;padding-top:14px}
.sh-foot .btn{flex:1;height:50px;justify-content:center;font-size:15px}
.sh-list{display:flex;flex-direction:column;padding-bottom:4px}
.sh-list button{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;border:0;background:none;padding:6px 8px;text-align:left;font-size:16px;border-radius:12px;color:var(--text)}
.sh-list button:active{background:var(--surface2)}
.sh-list button svg{width:22px;height:22px;color:var(--accent);flex:none}
.sh-list button small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.sh-list hr{border:0;border-top:1px solid var(--border);margin:4px 0;width:100%}
.sh-list .danger,.sh-list .danger svg{color:#d0574b}
.install-hint{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:35;display:flex;gap:12px;align-items:center;padding:12px 10px 12px 14px;border-radius:18px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:sheetIn .5s var(--ease);max-width:520px;margin:0 auto}
.install-hint .logo{flex:none}
.install-hint .ih-t{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.install-hint .ih-t b{display:block;font-size:14.5px}
.install-hint .ih-t span{color:var(--muted)}
.install-hint .btn{flex:none;height:44px}.install-hint .btn.icon{width:44px}

/* ── Phones & small tablets ── */
@media (max-width:860px){
  .desk-only{display:none!important}
  .mob-only{display:inline-flex!important;align-items:center;justify-content:center}
  header.top{position:relative;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg);border-bottom:0}
  .top-inner{flex-wrap:wrap;gap:10px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 2px calc(14px + env(safe-area-inset-left))}
  .brand{flex:1;min-width:0;gap:10px}.brand>div:last-child{min-width:0}
  .brand h1{font-size:19px;overflow:hidden;text-overflow:ellipsis}.brand p{display:none}
  .logo{width:36px;height:36px;font-size:18px;border-radius:10px;flex:none}
  .actions{gap:6px;margin:0}.actions .label{display:none}
  .btn{height:44px}.btn.icon{width:44px}
  #btnImport{width:44px;padding:0;justify-content:center}
  #btnTheme{display:none}
  .stats{order:3;width:100%;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .stats .stat.paid{display:block}
  .stat{min-width:0;padding:6px 8px;border-radius:10px}
  .stat b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat span{font-size:9.5px;letter-spacing:.05em;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
  .toolbar{padding:10px calc(14px + env(safe-area-inset-right)) 4px calc(14px + env(safe-area-inset-left));gap:8px;flex-wrap:wrap}
  .filterbar,main{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
  .search{flex:1 1 0;max-width:none;order:1;min-width:0}.search kbd{display:none}
  .search input{height:44px;font-size:16px;-webkit-appearance:none;appearance:none}
  .search svg{top:14px}
  #filtBtn{order:2}
  .seg{order:3;flex:1 1 100%}.seg button{flex:1;height:44px;justify-content:center;font-size:14px}
  .seg button span{display:inline}
  .filterbar{padding-top:0}.subbar{min-height:28px;font-size:12px;padding-left:2px}.subbar .clear{min-height:44px;padding:0 6px}
  main{padding-top:6px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  /* binder */
  .binder-wrap .flipbtn.side{display:none}
  .binder{padding:8px;border-radius:14px;width:100%!important;max-width:520px;touch-action:pan-y}
  .page{padding:4.5% 4% 3%}
  .pager{justify-content:space-between;gap:10px;margin:14px auto 0;max-width:520px}
  .pager .flipbtn{width:48px;height:48px;box-shadow:var(--shadow-sm)}
  .pmid{flex:1;flex-direction:column;gap:6px;min-width:0}
  .pager input[type=range]{width:100%;height:44px;margin:-8px 0}
  /* grid & list */
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px}
  .tile-name{font-size:12.5px}.tile-meta{font-size:11.5px}
  .group-h h3{font-size:16.5px}
  .list th[data-col]:not([data-col=name]):not([data-col=quantity]):not([data-col=value]),
  .list td[data-col]:not([data-col=name]):not([data-col=quantity]):not([data-col=value]){display:none}
  .list td{padding:9px 8px}.list th{padding:10px 8px}
  .list td[data-col=name]{white-space:normal;max-width:none;width:100%}
  .list th[data-col=quantity]{font-size:0}.list th[data-col=quantity]::before{content:"Qty";font-size:11px}
  .list .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .list .thumb{width:44px}.list .thumb .cf{width:34px}
  .list tr.row td{height:58px}
  /* detail panel → bottom sheet */
  .drawer{top:auto;left:0;right:0;width:100%;height:92vh;height:92dvh;border-left:0;border-radius:22px 22px 0 0;transform:translateY(105%)}
  .d-head{padding:14px 12px 0;touch-action:none;position:relative;min-height:52px}
  .d-head::before{content:"";position:absolute;left:50%;top:8px;width:42px;height:5px;border-radius:5px;background:var(--border2);transform:translateX(-50%)}
  .d-body{padding:2px calc(18px + env(safe-area-inset-right)) 24px calc(18px + env(safe-area-inset-left));overscroll-behavior:contain}
  .d-hero{flex-direction:row;align-items:flex-start;text-align:left;gap:14px;margin-top:0}
  .d-img{width:112px}
  .d-img-actions{flex-wrap:wrap}.d-img-actions .btn{height:44px;font-size:12.5px}.d-img-actions .btn.ghost{width:44px;padding:0;justify-content:center}
  .d-title input{font-size:20px;text-align:left;min-height:44px}
  .qty-step{margin:10px 0 0}.qty-step button{width:44px;height:44px;font-size:18px}.qty-step input{height:44px;font-size:16px}
  .d-kpis{gap:6px;margin-top:12px}.kpi{padding:6px 8px}.kpi b{font-size:14px}
  .form{gap:10px}
  .field input,.field select,.field textarea{height:46px;font-size:16px}
  .field textarea{height:96px}
  .field .money::before{top:13px}
  .d-foot{padding:10px calc(18px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
  /* modals → bottom sheets */
  .modal-back{place-items:end center;padding:0}
  .modal,.modal.sm{width:100%;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;animation:sheetIn .4s var(--ease)}
  .m-head{padding:20px 18px 4px}.m-head h2{font-size:19px}
  .m-body{padding:12px 18px}
  .m-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap}
  .m-foot .btn{height:46px;flex:1;justify-content:center}
  .m-foot .grow{flex-basis:100%}.m-foot .grow:empty{display:none}
  .map{grid-template-columns:minmax(0,110px) minmax(0,1fr)}.map .ex,.map .h.exh{display:none}
  .map select{height:44px;font-size:16px}
  .opts .radio{flex-direction:column;gap:8px}.opts label{min-height:32px}
  .imgrow{grid-template-columns:56px minmax(0,1fr)}.imgrow img{width:56px}
  .imgrow .fs{grid-template-columns:1fr}
  .imgrow .fs input,.imgrow select{height:44px;font-size:16px}
  .empty{margin-top:3vh}.drop{padding:30px 18px;border-radius:20px}.empty h2{font-size:23px}
  .empty .row .btn{flex:1 1 100%;justify-content:center;height:48px}
  .menu{display:none}
}
@media (max-width:600px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:340px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} .stat span{font-size:8.5px} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand"><div class="logo" id="logo"></div><div><h1 id="appTitle"></h1><p id="appSub"></p></div></div>

  <div class="actions">
    <button class="btn primary" id="btnImport" title="Import files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14a2 2 0 0 0 2-2v-4M3 15v4a2 2 0 0 0 2 2"/></svg><span class="label">Import</span></button>
    <button class="btn icon" id="btnTheme" title="Toggle light / dark"></button>
    <button class="btn icon" id="btnMenu" title="More"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </div>
</div></header>
<div id="toolbarHost"></div>
<main id="main"></main>
<div class="scrim" id="scrim"></div>

  const s = String(v).replace(/[^0-9.\-]/g, ''); if (!s || s === '-' || s === '.') return null; const n = parseFloat(s); return isFinite(n) ? n : null; };

        const r = indexedDB.open(CONFIG.id + '-db', 1);

  tx(store, mode, fn) {

/* ───────────── Ordering, filtering, grouping ───────────── */
const orderList = o => o === 'rarities' ? CONFIG.rarities || [] : o === 'conditions' ? CONFIG.conditions || [] : o === 'types' ? types.map(t => t.value) : Array.isArray(o) ? o : [];
function rankIn(list, v) {

}
function comparator(opt) {

  if (opt.kind === 'number') return { blank: c => num(c[f]) == null, cmp: (a, b) => num(a[f]) - num(b[f]) };
  if (opt.kind === 'order') { const L = orderList(opt.order); return { blank: c => !c[f], cmp: (a, b) => rankIn(L, a[f]) - rankIn(L, b[f]) || coll.compare(a[f] || '', b[f] || '') }; }
  return { blank: c => !String(c[f] ?? '').trim(), cmp: (a, b) => coll.compare(String(a[f]), String(b[f])) };
}
const tiebreak = (a, b) => coll.compare(a.name || '', b.name || '') || coll.compare(a.number || '', b.number || '') || coll.compare(a.set || '', b.set || '');
function sortCards(list) {

  const { blank, cmp } = comparator(opt), d = S.set.dir;
  return list.sort((a, b) => { const ba = blank(a), bb = blank(b); if (ba !== bb) return ba ? 1 : -1; return (ba ? 0 : cmp(a, b) * d) || tiebreak(a, b); });
}

    if (S.set.type && normH(c[TYPEF]) !== normH(S.set.type)) return false;
    for (const fl of CONFIG.filters || []) { const v = S.set.f[fl.field]; if (v && String(c[fl.field] ?? '').trim() !== v) return false; }
    if (terms.length) { const hay = (CONFIG.searchFields || ['name']).map(k => c[k] ?? '').join(' ').toLowerCase(); if (!terms.every(t => hay.includes(t))) return false; }

}
function groupKey(opt, c) {
  if (opt.kind === 'letter') { const ch = String(c[opt.field] || '').trim().charAt(0).toUpperCase(); return /[A-Z]/.test(ch) ? ch : ch ? '#' : '—'; }
  if (opt.kind === 'valueBand') { const v = valueOf(c), b = CONFIG.valueBands || [100, 25, 5, 1];
    for (let i = 0; i < b.length; i++) if (v >= b[i]) return i === 0 ? fmtMoney(b[0]) + '+' : fmtMoney(b[i]) + ' – ' + fmtMoney(b[i - 1]);
    return 'Under ' + fmtMoney(b[b.length - 1]); }
  const v = String(c[opt.field] ?? '').trim(); return v || 'Unspecified';
}
function grouped(list) {
  const opt = (CONFIG.groupOptions || []).find(o => o.key === S.set.group);
  if (!opt || opt.key === 'none') return [{ label: null, cards: list }];
  const m = new Map(); list.forEach(c => { const k = groupKey(opt, c); if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
  const keys = [...m.keys()], un = k => (k === 'Unspecified' || k === '—') ? 1 : 0;

  else if (opt.kind === 'valueBand') { keys.sort((a, b) => Math.max(...m.get(b).map(valueOf)) - Math.max(...m.get(a).map(valueOf))); }

function openMenu() {

    $('.sh-list', sh.node).onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; sh.close(); runMenu(b.dataset.a); };

async function runMenu(a) {
  if (a === 'add') addBlankCard();
  if (a === 'photos') isPhone() ? $('#photoPick').click() : pickFiles('image/*');
  if (a === 'lookup') lookupAll();
  if (a === 'csv') exportCSV();
  if (a === 'backup') exportBackup();
  if (a === 'restore') isPhone() ? $('#dataPick').click() : pickFiles('.json,application/json');
  if (a === 'theme') setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  if (a === 'install') showInstallHelp();
  if (a === 'sample') importTable('sample-data.csv', parseCSV(CONFIG.sampleCSV));
  if (a === 'clear') { const v = await ask('Clear binder?', `This removes all ${S.cards.length} cards and photos from this ${isPhone() ? 'device' : 'browser'}. Make a backup first if you might want them back.`, [{ label: 'Cancel' }, { label: 'Back up first', value: 'backup' }, { label: 'Clear everything', value: 'clear', cls: 'primary' }]);
    if (v === 'backup') exportBackup();
    if (v === 'clear') { await DB.clear('cards'); await DB.clear('images'); S.imgs.forEach(u => URL.revokeObjectURL(u)); S.imgs.clear(); S.cards = []; S.set.page = 0; closeDetail(); renderToolbar(); renderMain(); toast('Binder cleared'); } }
}
function setTheme(t) { document.documentElement.dataset.theme = t; S.set.theme = t; try { localStorage.setItem(CONFIG.id + '-theme', t); } catch {} saveSettings(); renderHeader(); }
let dragDepth = 0; const hideDrop = () => { dragDepth = 0; $('#dropover').classList.remove('on'); };

/* ───────────── Installable app (PWA): install hint, service worker, storage ───────────── */
async function showInstallHelp() {
  if (S.installEvt) { const ev = S.installEvt; S.installEvt = null; ev.prompt(); const r = await ev.userChoice.catch(() => null); if (r && r.outcome === 'accepted') toast('Installed. Find it on your home screen.'); return; }
  if (isStandalone()) { toast('You\'re already using the installed app.'); return; }
  const msg = !isPWA() ? `This single-file copy can't be installed. Put the <b>binder-web</b> folder on a free static host (see the README), open that link on your phone, and install it from there.`
    : isIOS() ? `In Safari, tap <b>Share</b> ${ICON.shareIOS} and then <b>Add to Home Screen</b>. The binder will open full-screen and work offline.`
    : `Open the browser menu <b>⋮</b> and choose <b>Install app</b> (or <b>Add to Home screen</b>). The binder will open like an app and work offline.`;
  await ask('Install on your phone', `${msg}<br><br><span style="font-size:12.5px">Each device keeps its own copy of your collection. To move cards between devices, use <b>⋯ → Back up</b> on one and <b>Restore</b> on the other.</span>`, [{ label: 'Got it', cls: 'primary' }]);

function maybeShowInstallHint() {

  if (dismissed || (!isIOS() && !S.installEvt)) return;
  const h = el(`<div class="install-hint" role="status"><div class="logo">${esc(CONFIG.logo || '✦')}</div>
    <div class="ih-t"><b>Install on your phone</b><span>${isIOS() ? `Tap Share ${ICON.shareIOS} then “Add to Home Screen”` : 'Opens full-screen and works offline'}</span></div>
    ${S.installEvt ? '<button class="btn primary" data-act="install">Install</button>' : ''}<button class="btn icon ghost" data-act="x" aria-label="Dismiss">${ICON.close}</button></div>`);
  document.body.append(h);
  h.onclick = e => { const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return; if (a === 'install') showInstallHelp();
    try { localStorage.setItem(CONFIG.id + '-install-hint', '1'); } catch {} h.remove(); };
}
function registerSW() {

/* ───────────── Boot ───────────── */
async function boot() {
  const R = document.documentElement.style, T = CONFIG.theme || {};
  T.accentLight && R.setProperty('--accent-l', T.accentLight); T.accentDark && R.setProperty('--accent-d', T.accentDark);
  T.coverLight && R.setProperty('--cover-l', T.coverLight); T.coverDark && R.setProperty('--cover-d', T.coverDark);
  T.titleFont && R.setProperty('--title', T.titleFont); CONFIG.cardAspect && R.setProperty('--card-aspect', CONFIG.cardAspect);
  document.title = CONFIG.title;
  let th = null; try { th = localStorage.getItem(CONFIG.id + '-theme'); } catch {}
  document.documentElement.dataset.theme = th || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  renderHeader();
  await DB.open();
  try {
    const st = await DB.get('meta', 'settings'); if (st) Object.assign(S.set, st, { q: '' });
    if (S.set.theme && !th) document.documentElement.dataset.theme = S.set.theme;
    S.cards = (await DB.all('cards')) || [];
    const keys = (await DB.keys('images')) || [];
    for (const k of keys) { const b = await DB.get('images', k); if (b) S.imgs.set(k, URL.createObjectURL(b)); }
  } catch (e) { console.error(e); toast('Could not load saved data: ' + esc(e.message)); }
  if (!CONFIG.sortOptions.some(o => o.key === S.set.sort)) S.set.sort = CONFIG.sortOptions[0].key;
  if (!(CONFIG.groupOptions || []).some(o => o.key === S.set.group)) S.set.group = 'none';
  $('#btnImport').onclick = () => (isPhone() ? openImportSheet() : $('#filePick').click());
  ['#filePick', '#camPick', '#photoPick', '#dataPick'].forEach(id => { $(id).onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) handleFiles(f); }; });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; maybeShowInstallHint(); });
  window.addEventListener('appinstalled', () => { S.installEvt = null; $('.install-hint')?.remove(); });
  registerSW(); setTimeout(maybeShowInstallHint, 2500);
  $('#btnTheme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  $('#btnMenu').onclick = openMenu;
  $('#scrim').onclick = closeDetail;
  document.addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o && !e.target.closest('.drawer') && !(S.swiped && Date.now() - S.swiped < 400)) openDetail(o.dataset.open); });

    if (typing) return;
